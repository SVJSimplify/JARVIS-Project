name: JINI build

on:
  push:
    branches: [jini-mvp, main]
  pull_request:
  workflow_dispatch:

jobs:
  android-apk:
    name: Android APK (debug-signed, installable)
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the latest APK to the apk-latest branch
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # GitHub's Ubuntu runners ship the Android SDK; point Gradle at it (and accept licences).
      - name: Use preinstalled Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install
        run: npm ci
      - name: Typecheck + build web bundle (fails the job on any error)
        run: npm run build
      - name: Sync native project
        run: npx cap sync android
      - name: Assemble APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../JINI-mobile-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JINI-mobile-apk
          path: JINI-mobile-debug.apk
          if-no-files-found: error
      - name: Publish latest APK to the apk-latest branch
        if: github.event_name == 'push'
        working-directory: .
        run: |
          mkdir /tmp/apk && cp JINI-mobile-debug.apk /tmp/apk/
          cd /tmp/apk
          echo "Built from ${GITHUB_SHA} on ${GITHUB_REF_NAME}" > BUILD.txt
          git init -q -b apk-latest
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "JINI APK from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-latest

  desktop-check:
    name: Desktop typecheck, link tests, renderer build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck (main + renderer)
        run: npx tsc -p tsconfig.node.json --noEmit && npx tsc -p tsconfig.app.json --noEmit
      - name: JINI device-link tests
        run: npx vitest run tests/jini
      - name: Renderer build
        run: npx vite build
