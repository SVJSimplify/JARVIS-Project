name: JINI build

on:
  push:
    branches: [jini-mvp, jini-mvp-chatgpt, main]
  pull_request:
    branches: [jini-mvp, main]
  workflow_dispatch:

jobs:
  android-apk:
    name: Android APK (debug-signed, installable)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # GitHub's Ubuntu runners ship the Android SDK; point Gradle at it (and accept licences).
      - name: Use preinstalled Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install
        run: npm ci
      - name: Mobile typecheck
        run: npm run typecheck
      - name: Typecheck + build web bundle (fails the job on any error)
        run: npm run build
      - name: Sync native project
        run: npx cap sync android
      # Cache Gradle distributions and dependency artifacts between CI runs. This avoids
      # repeatedly hitting Maven repositories for the Android Gradle Plugin dependency graph.
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble APK (retry transient repository failures)
        working-directory: mobile/android
        shell: bash
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            log_file="$(mktemp)"
            gradle_args=(assembleDebug --no-daemon --stacktrace)
            if [ "$attempt" -gt 1 ]; then
              gradle_args+=(--refresh-dependencies)
            fi

            set +e
            ./gradlew "${gradle_args[@]}" 2>&1 | tee "$log_file"
            build_status=${PIPESTATUS[0]}
            set -e
            if [ "$build_status" -eq 0 ]; then
              rm -f "$log_file"
              exit 0
            fi

            # Retry only repository/dependency resolution failures. Compilation, source,
            # manifest and packaging errors are deterministic and should fail immediately.
            if ! grep -Eqi 'Could not (find|resolve|GET|HEAD)|Could not resolve all (artifacts|files)|Resource missing' "$log_file"; then
              rm -f "$log_file"
              exit "$build_status"
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Gradle dependency resolution failed after 3 attempts."
              rm -f "$log_file"
              exit "$build_status"
            fi
            echo "Transient Gradle repository resolution failure (attempt $attempt/3); retrying after backoff..."
            rm -f "$log_file"
            sleep $((attempt * 15))
          done
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../JINI-mobile-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JINI-mobile-apk
          path: JINI-mobile-debug.apk
          if-no-files-found: error

  desktop-check:
    name: Desktop typecheck, link tests, renderer build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck (main + renderer)
        run: npx tsc -p tsconfig.node.json --noEmit && npx tsc -p tsconfig.app.json --noEmit
      - name: Full unit and integration test suite
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Renderer build
        run: npx vite build

  desktop-installer:
    name: Windows desktop installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build renderer, main and preload (fails on any type error)
        run: |
          npm run build:renderer
          npm run build:main
          npm run build:preload
      - name: Prepare optional local AI installer component
        run: npm run prepare:local-ai
      - name: Package NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --publish never
      - name: Collect installer
        shell: bash
        run: |
          mkdir out
          installer="$(find release -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$installer"
          cp "$installer" "out/JINI-Desktop-Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: JINI-desktop-installer
          path: out/JINI-Desktop-Setup.exe
          if-no-files-found: error

  publish-builds:
    name: Publish latest builds to the builds-latest branch
    if: github.event_name == 'push' && github.ref_name != 'jini-mvp-chatgpt'
    needs: [android-apk, desktop-installer, desktop-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Push builds
        run: |
          mkdir pub
          cp dl/JINI-mobile-apk/JINI-mobile-debug.apk pub/
          # git refuses files over 100 MB: ship the installer in 90 MB parts plus its checksum.
          (cd dl/JINI-desktop-installer && sha256sum JINI-Desktop-Setup.exe > ../../pub/JINI-Desktop-Setup.exe.sha256)
          split -b 90m -d dl/JINI-desktop-installer/JINI-Desktop-Setup.exe pub/JINI-Desktop-Setup.exe.part
          (cd dl/JINI-mobile-apk && sha256sum JINI-mobile-debug.apk > ../../pub/JINI-mobile-debug.apk.sha256)
          echo "Built from ${GITHUB_SHA} on ${GITHUB_REF_NAME}" > pub/BUILD.txt
          cd pub
          git init -q -b builds-latest
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "JINI builds from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" builds-latest
