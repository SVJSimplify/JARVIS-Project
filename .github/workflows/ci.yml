name: JINI CI

on:
  push:
    branches:
      - jini-mvp-chatgpt
    paths-ignore:
      - 'tests/redactCredentialOutput.test.ts'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - jini-mvp-chatgpt
    paths-ignore:
      - 'tests/redactCredentialOutput.test.ts'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jini-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-installer:
    name: Lint, typecheck, tests, builds and Windows installer
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Full unit test suite
        run: npm test -- --reporter=dot

      - name: Build renderer
        run: npm run build:renderer

      - name: Build Electron main process
        run: npm run build:main

      - name: Build preload
        run: npm run build:preload

      - name: Prepare optional Local AI installer payload
        run: npm run prepare:local-ai

      - name: Package Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --publish never

      - name: Collect installer
        shell: bash
        run: |
          mkdir out
          installer="$(find release -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$installer"
          cp "$installer" "out/JINI-Desktop-Setup.exe"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JINI-desktop-installer
          path: out/JINI-Desktop-Setup.exe
          if-no-files-found: error
